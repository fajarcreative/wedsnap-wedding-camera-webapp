<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#eedcba"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1a4"/>
      <stop offset="50%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#775a19"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2926"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#775a19" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer decorative border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Camera Body -->
  <g filter="url(#shadow)">
    <!-- Main Camera Housing -->
    <rect x="76" y="140" width="360" height="260" rx="44" fill="url(#darkGrad)"/>
    
    <!-- Top Viewfinder Prism -->
    <path d="M186 140 L216 100 L296 100 L326 140 Z" fill="url(#goldGrad)"/>

    <!-- Flash module -->
    <rect x="110" y="170" width="44" height="26" rx="8" fill="#fdfbf7" stroke="url(#goldGrad)" stroke-width="3"/>

    <!-- Red recording dot -->
    <circle cx="180" cy="183" r="6" fill="#e53e3e"/>

    <!-- Film Counter Window -->
    <rect x="340" y="165" width="56" height="32" rx="8" fill="#141210" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="368" y="187" font-family="monospace" font-size="16" font-weight="bold" fill="#f5e1a4" text-anchor="middle">36</text>

    <!-- Outer Gold Lens Ring -->
    <circle cx="256" cy="275" r="95" fill="none" stroke="url(#goldGrad)" stroke-width="12"/>
    
    <!-- Inner Lens Aperture -->
    <circle cx="256" cy="275" r="82" fill="#1b1c1a"/>
    <circle cx="256" cy="275" r="70" fill="#2d2926"/>
    <circle cx="256" cy="275" r="54" fill="#0f0f0f"/>
    <circle cx="256" cy="275" r="38" fill="url(#goldGrad)" opacity="0.3"/>

    <!-- Lens Reflection Glass Glare -->
    <path d="M220 235 A55 55 0 0 1 292 235 A55 40 0 0 0 220 235 Z" fill="#ffffff" opacity="0.35"/>
    
    <!-- Heart icon in center of lens -->
    <path d="M256 288 C256 288 238 275 238 264 C238 258 243 254 249 254 C253 254 256 257 256 257 C256 257 259 254 263 254 C269 254 274 258 274 264 C274 275 256 288 256 288 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography WedSnap -->
  <text x="256" y="445" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="bold" fill="#775a19" text-anchor="middle" letter-spacing="4">WEDSNAP</text>
  <text x="256" y="475" font-family="sans-serif" font-size="14" font-weight="600" fill="#a07d32" text-anchor="middle" letter-spacing="3">FAJAR &amp; AULIA</text>
</svg>

